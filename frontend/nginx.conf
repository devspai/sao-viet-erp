# Phục vụ SPA (Vite build) + reverse-proxy API sang backend FastAPI trong cùng compose.
# Khối http (worker, giới hạn kết nối, log) nằm ở nginx-main.conf.

# Kho tệp MinIO cho `location /_kho_tep/`. Khối upstream (không phải proxy_pass tới tên máy trong biến)
# để GIỮ kết nối dùng lại: mở TCP mới cho mỗi tấm ảnh thì 40 người cùng mở màn là chậm hơn cả khi
# Python tự bơm. `resolve` (nginx ≥ 1.27.3) tra lại IP khi container minio được tạo lại — không có nó
# nginx giữ IP cũ tới lúc chính nó khởi động lại.
upstream kho_minio {
    zone kho_minio 64k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    server minio:9000 resolve;
    keepalive 32;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Phân giải `backend` bằng DNS nội bộ của Docker LÚC CÓ REQUEST (cache 10s), không phải một lần lúc
    # nginx khởi động. Deploy tạo lại container backend thì nó mang IP mới — trước đây nginx giữ IP cũ
    # và treo request tới 60s. Muốn nginx phân giải lại thì proxy_pass PHẢI đi qua biến.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    set $be http://backend:8000;

    # Nén để tải nhanh
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Trần của MỘT request tải tệp. Phải cao hơn mức chặn lớn nhất của backend (tệp đính kèm lệnh SX 50MB)
    # cộng phần vỏ multipart — thấp hơn thì nginx trả 413 dạng HTML trước khi backend kịp nói lý do.
    client_max_body_size 60m;

    # SSE real-time luồng gửi duyệt (kết nối sống lâu) — PHẢI tắt buffering/gzip để đẩy tức thì,
    # timeout dài để không bị cắt khi idle. Prefix dài hơn nên khớp TRƯỚC block /api/ chung.
    location /api/quotations/events {
        # proxy_pass có biến mà KHÔNG kèm URI ⇒ nginx gửi nguyên URI gốc của request (giữ /api/...).
        proxy_pass $be;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";      # giữ keep-alive tới backend
        proxy_connect_timeout 5s;
        proxy_buffering off;                          # KHÔNG đệm → sự kiện ra ngay
        proxy_cache off;
        gzip off;                                     # nén sẽ đệm/vỡ SSE
        chunked_transfer_encoding off;
        proxy_read_timeout 3600s;                     # stream idle vẫn giữ 1h
        # Backend đang restart: trả 503 JSON + Retry-After như /api/ thay vì 502 trần.
        error_page 502 503 504 = @api_loi;
    }

    # API → backend (GIỮ NGUYÊN prefix /api: proxy_pass qua biến, không URI).
    location /api/ {
        proxy_pass $be;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        # Backend đang khởi động lại thì nối hỏng ngay (connection refused) hoặc trong 5s — không để
        # người dùng chờ 60s mặc định.
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        # 502/503/504 do CHÍNH nginx sinh ra (không nối được / backend quá giờ) ⇒ trả JSON tiếng Việt
        # thay trang HTML, kèm Retry-After để client tự thử lại. Lỗi 5xx do BACKEND trả thì vẫn đi
        # nguyên (không bật proxy_intercept_errors) — backend tự nói lý do.
        error_page 502 503 504 = @api_loi;
    }

    # Tệp người dùng: backend (`/api/files`) kiểm đăng nhập + quyền rồi trả `X-Accel-Redirect` về đây
    # kèm đường dẫn MinIO ĐÃ KÝ (hết hạn 60s) — nginx tự kéo byte, Python không bơm gì (đo 29/09/2026:
    # Python bơm thì 200 người mở màn có ảnh là p50 54s). `internal` ⇒ trình duyệt không gọi thẳng được.
    location /_kho_tep/ {
        internal;
        # Header của response backend còn đọc được ở đây, trước khi proxy_pass mở upstream mới.
        set $kho_duong $upstream_http_x_kho_duong;
        set $tep_etag  $upstream_http_x_tep_etag;
        # Host PHẢI trùng host backend đã ký (MINIO_ENDPOINT trong docker-compose.yml), không thì
        # MinIO trả 403 SignatureDoesNotMatch. proxy_pass có biến ⇒ gửi NGUYÊN đường dẫn đã ký.
        proxy_pass http://kho_minio$kho_duong;
        proxy_http_version 1.1;
        proxy_set_header Host minio:9000;
        proxy_set_header Connection "";
        # Không gửi thông tin đăng nhập của người dùng sang kho tệp.
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_set_header If-None-Match "";
        proxy_set_header If-Modified-Since "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        # ETag/Last-Modified của MinIO khác ETag của /api/files (backend so If-None-Match theo khoá
        # tệp) ⇒ giấu của MinIO, gắn của backend. Content-Type/Disposition đã ký trong đường dẫn.
        proxy_hide_header ETag;
        proxy_hide_header Last-Modified;
        proxy_hide_header Server;
        proxy_hide_header x-amz-request-id;
        proxy_hide_header x-amz-id-2;
        proxy_hide_header X-Xss-Protection;
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header Vary;
        proxy_hide_header X-Content-Type-Options;   # MinIO cũng gửi ⇒ trùng với dòng add_header dưới
        add_header ETag $tep_etag;
        add_header Cache-Control "private, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff;
        # Tệp đã xoá / chữ ký sai ⇒ JSON tiếng Việt như backend, không lộ XML của MinIO.
        proxy_intercept_errors on;
        error_page 403 404 = @tep_khong_co;
        # 429: MinIO tự giới hạn số request đồng thời theo RAM (đo 30/09/2026 trên máy 2GB: 67) — quá
        # mức thì trả XML "TooManyRequests"; đổi thành 503 JSON + Retry-After như lúc backend bận.
        error_page 429 502 503 504 = @api_loi;
    }

    location @tep_khong_co {
        default_type "application/json; charset=utf-8";
        add_header Cache-Control "no-store" always;
        return 404 '{"detail":"Không tìm thấy tệp"}';
    }

    location @api_loi {
        default_type "application/json; charset=utf-8";
        add_header Retry-After 3 always;
        add_header Cache-Control "no-store" always;
        return 503 '{"detail":"Máy chủ đang khởi động lại hoặc quá tải, vui lòng thử lại."}';
    }

    # Assets có hash → cache dài
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff;
    }

    # index.html LUÔN revalidate (no-cache) → sau MỖI deploy trình duyệt lấy NGAY bản mới, không giữ
    # index.html cũ trỏ tới bundle /assets cũ (đã immutable 30d) khiến app đứng ở bản cũ. Chuẩn SPA:
    # asset có hash = cache dài; index.html = luôn kiểm bản mới (ETag/Last-Modified → 304 nếu chưa đổi).
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff;
    }

    # SPA fallback: mọi route khác trả index.html
    location / {
        add_header X-Content-Type-Options nosniff;
        try_files $uri $uri/ /index.html;
    }
}
