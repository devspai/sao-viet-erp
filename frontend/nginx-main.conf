# Thay /etc/nginx/nginx.conf mặc định của image nginx:alpine (xem frontend/Dockerfile).
# Mặc định image chỉ cho 1024 kết nối mỗi worker — mỗi tab mở app giữ 1 kết nối SSE sống lâu, cộng
# kết nối tới backend, 500 người dùng vài tab là chạm trần. Cấu hình site nằm ở conf.d/app.conf
# (frontend/nginx.conf).
user nginx;
worker_processes auto;
# Mỗi kết nối client proxy sang backend tốn 2 file descriptor.
worker_rlimit_nofile 16384;

error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 8192;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" rt=$request_time';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    # Không lộ phiên bản nginx ở header Server và trang lỗi.
    server_tokens off;

    include /etc/nginx/conf.d/*.conf;
}
